<!Doctype html>
<html>
<head>
	<meta http-equiv="content-type"
	content="text/html; charset=utf-8"/>
	<title>
		Welcher ist kleiner?
	</title>
	<style>
		.kleinerButton {
			border-radius: 50%;
			width: 90px;
			height: 90px;
			background-color: orange;
		}
		.großerButton {
			border-radius: 50%;
			width: 93px;
			height: 93px;
			background-color: orange;
		}
	</style>
	<script>
		function checkGröße(größe) {
			if (größe == 1) {
				alert("Richtig!")
			}
			else {
				alert("Falsch!")
			}
		}
	</script>
</head>
<body>
	<p style="font-size: 25px; text-align: center;">Welcher Kreis ist kleiner?</p>
	<p style="text-align: center;">
    <button class="kleinerButton" onclick="checkGröße(1);"></button>
    <button class="großerButton" onclick="checkGröße(2);"></button>
    <button class="großerButton" onclick="checkGröße(2);"></button>
	</p>
</body>
 </html>
